services:
  - type: web
    name: objekta-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://objekta3d.vercel.app
      - key: EXTRA_CORS_ORIGINS
        value: https://objekta-9.onrender.com
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE
        sync: false

# Frontend will be deployed on Vercel. Removed Render frontend service to avoid duplicate deployments.
