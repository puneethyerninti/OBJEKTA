name: CI — Objekta

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --reporter=verbose
        env:
          CI: true
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install test deps
        working-directory: backend
        run: npm install --save-dev jest mongodb-memory-server supertest
      - name: Run marketplace tests
        working-directory: backend
        run: npx jest tests/ --forceExit --detectOpenHandles
        env:
          JWT_SECRET: ci-test-secret
          PAYMENT_PROVIDER: mock

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t objekta:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          MONGO_URI: mongodb://localhost:27017/objekta_e2e
          JWT_SECRET: e2e-test-secret
          PAYMENT_PROVIDER: mock
          FRONTEND_ORIGIN: http://localhost:5173
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
