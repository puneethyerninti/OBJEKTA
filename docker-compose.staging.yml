version: "3.9"

# Staging environment — closer to production, uses built frontend served by backend
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_staging:/data/db
    environment:
      MONGO_INITDB_DATABASE: objekta_staging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      PORT: 5000
      NODE_ENV: staging
      MONGO_URI: mongodb://mongo:27017/objekta_staging
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-10}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5000}
      TRUST_PROXY: "true"
    volumes:
      - uploads_staging:/app/backend/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_staging:
  uploads_staging:
