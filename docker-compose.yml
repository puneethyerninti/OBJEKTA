services:
  # ── MongoDB ────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: objekta

  # ── Local LLM (Ollama) ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # ── Backend API ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - ollama
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/objekta
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      NODE_ENV: ${NODE_ENV:-development}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-10}
      FRONTEND_ORIGIN: http://localhost:5173,http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-qwen2.5:14b-instruct}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      AI_REQUIRE_LLM: ${AI_REQUIRE_LLM:-true}
    volumes:
      - uploads_data:/app/backend/uploads

  # ── Frontend Dev Server (optional — for development) ───
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://localhost:5000
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo_data:
  uploads_data:
  ollama_data:
