version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: objekta

  ai:
    build:
      context: ./backend/ai_service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
      - ai
    ports:
      - "5000:5000"
    env_file:
      - ./.env.production
    environment:
      PORT: 5000
      NODE_ENV: production
      TRUST_PROXY: "true"
      AI_SERVICE_URL: http://ai:8100
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  uploads_data:
