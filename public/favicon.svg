<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="100%" stop-color="#00d7ff"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d7ff"/>
      <stop offset="50%" stop-color="#ff47a3"/>
      <stop offset="100%" stop-color="#7f5af0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="#0a0814"/>
  <!-- Subtle gradient overlay -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" opacity="0.12"/>
  <!-- 3D Cube outline (represents 3D workspace) -->
  <g filter="url(#glow)" opacity="0.25">
    <polygon points="256,80 416,168 416,344 256,432 96,344 96,168" fill="none" stroke="url(#face)" stroke-width="3"/>
  </g>
  <!-- "O" letterform — bold geometric -->
  <g transform="translate(256,256)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#bg)" stroke-width="32" stroke-linecap="round"/>
    <!-- Inner accent cut -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#face)" stroke-width="6" stroke-dasharray="120 700" stroke-linecap="round" opacity="0.9" transform="rotate(-45)"/>
    <!-- Diamond accent in center -->
    <polygon points="0,-42 42,0 0,42 -42,0" fill="url(#bg)" opacity="0.85"/>
    <polygon points="0,-24 24,0 0,24 -24,0" fill="#0a0814" opacity="0.7"/>
  </g>
</svg>
